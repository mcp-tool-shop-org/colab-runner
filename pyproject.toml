[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-runner"
version = "0.1.1"
description = "Shared runner for paid Google Colab windows: a detached job runner with a spend guard and token scrubbing."
readme = "README.md"
license = "MIT"
authors = [{ name = "mcp-tool-shop" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.3", "coverage==7.11.0", "setuptools>=68", "wheel"]

[project.urls]
Repository = "https://github.com/mcp-tool-shop-org/colab-runner"

[tool.setuptools.packages.find]
include = ["colab_runner*"]

[tool.setuptools.package-data]
# the vendored window library and the VM cells are data the runner ships, not importable modules
"colab_runner.window_lib" = ["*.sh", "*.md", "*.py"]
"colab_runner.vm" = ["*.py"]

[tool.ruff]
# vendored byte for byte (see colab_runner/window_lib/PROVENANCE.md); never edited here
extend-exclude = ["colab_runner/window_lib"]

[tool.ruff.lint.per-file-ignores]
# the VM cells are concatenated with lib.py and run as one kernel cell, so their names resolve at run time
"colab_runner/vm/*.py" = ["F821"]

[tool.coverage.run]
# vendored byte for byte (see colab_runner/window_lib/PROVENANCE.md); pinned by test_window_lib
omit = ["colab_runner/window_lib/*"]
