name: CI

on:
  push:
    branches: [main]
    paths:
      - "colab_runner/**"
      - "tests/**"
      - "atlas/**"
      - "verify.sh"
      - "pyproject.toml"
      - "codecov.yml"
      - "site/**"
      - "scripts/**"
      - ".github/audit-allowlist.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # Codecov upload over OIDC; no stored token
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (the package and its dev tools)
        run: python -m pip install -e ".[dev]"

      - name: Verify (lint, tests, smoke)
        run: bash verify.sh

      - name: Coverage (floor 90)
        if: matrix.python-version == '3.12'
        run: |
          python -m coverage run --source=colab_runner -m unittest discover -s tests
          python -m coverage report --fail-under=90
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.12'
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
          files: coverage.xml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.python-version == '3.12'
        with:
          node-version: 22

      - name: Atlas check
        if: matrix.python-version == '3.12'
        run: npx --yes @dogfood-lab/atlas@1.26.0 check

      # The landing page and handbook build here, so a broken page fails the PR rather than the Pages deploy after
      # merge (pages.yml runs only on main). The site's npm audit goes through scripts/check-audit-allowlist.mjs
      # (ported from merchant-league, tested by the node --test line): reviewed, time-boxed exceptions live in
      # .github/audit-allowlist.json, and any high or critical advisory not listed there, listed but expired, or whose
      # reported range or fix status has changed, still fails this step.
      - name: Site build
        if: matrix.python-version == '3.12'
        working-directory: site
        run: |
          npm ci --no-fund --no-audit
          node --test ../scripts/check-audit-allowlist.test.mjs
          set +e
          npm audit --audit-level=high --json > audit-report.json
          AUDIT_EXIT=$?
          set -e
          node ../scripts/check-audit-allowlist.mjs audit-report.json ../.github/audit-allowlist.json "$AUDIT_EXIT" package-lock.json
          npm run build

      # Dependency scan (pip-audit, pinned). colab-runner has no runtime dependencies (pyproject: dependencies = []), so
      # this audits the dev dependencies and whatever installing the package pulled in: the environment as
      # `pip install -e ".[dev]"` left it, frozen before pip-audit itself is installed (pip and the editable package
      # are not in the freeze). An advisory fails the step; it is never ignored or skipped here.
      - name: Dependency audit (pip-audit)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
          cat "$RUNNER_TEMP/audit-requirements.txt"
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/audit-requirements.txt"
